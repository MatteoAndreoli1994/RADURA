<!-- Incolla in Cookiebot → Configuration → Design → Custom HTML -->
<div id="CybotCookiebotDialog" class="radura-cookiebot">
  <div class="radura-cookiebot-inner">
    <h2 id="CybotCookiebotDialogHeaderTitle" class="radura-cookiebot-title">
      [#TITLE#]
    </h2>
    <div id="CybotCookiebotDialogBodyContent" class="radura-cookiebot-text">
      [#TEXT#]
    </div>
    <div class="radura-cookiebot-actions">
      <button
        type="button"
        id="CybotCookiebotDialogBodyButtonAccept"
        class="radura-cookiebot-accept"
      >
        [#ACCEPT#]
      </button>
      <button
        type="button"
        id="CybotCookiebotDialogBodyButtonDetails"
        class="radura-cookiebot-details"
      >
        [#DETAILS#]
      </button>
    </div>
  </div>
</div>
